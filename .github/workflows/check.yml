name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --extra clearml --frozen
      - run: uv run --locked --no-sync pytest
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy
      - run: uv run --locked --no-sync vulture
      - run: uv run --locked --no-sync lint-imports
      - run: uv lock --check
      - run: uv build
